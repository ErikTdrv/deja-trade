services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: deja-postgres
    environment:
      POSTGRES_USER: deja
      POSTGRES_PASSWORD: deja
      POSTGRES_DB: deja
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: deja-redis
    ports:
      - "6379:6379"
  kafka:
    image: apache/kafka:3.9.0
    container_name: deja-kafka
    ports:
      - "9092:9092"
volumes:
  pgdata: